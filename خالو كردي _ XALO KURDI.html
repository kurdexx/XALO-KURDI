<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خالو كردي | XALO KURDI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#a3302c;--green:#2f5d3a;--sun:#c9a227;--bg:#1a1410;--ink:#f6ecd6;--card:#271e17;--muted:#cdbb99;--line:#4d3b2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#1a1410;--ink:#f6ecd6;--card:#271e17;--muted:#cdbb99;--line:#4d3b2a}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.8;overflow-x:hidden}
[dir=ltr] body{font-family:Cairo,system-ui,sans-serif}
.flagbar{height:8px;background:linear-gradient(90deg,#ed2024 33%,#fff 33% 66%,#278e43 66%)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1100px;margin:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;text-decoration:none;color:var(--ink)}
.logo svg{width:34px;height:34px}
.menu{margin-inline-start:auto;display:flex;gap:6px;list-style:none;padding:0;margin-block:0}
.menu a{display:block;padding:6px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;transition:.2s}
.menu a:hover,.menu a:focus-visible{background:var(--sun);color:#201712;outline:none}
.tools{display:flex;gap:8px}
.tools button,.burger{font:inherit;font-weight:900;border:2px solid var(--sun);background:transparent;color:var(--ink);padding:4px 12px;border-radius:10px;cursor:pointer}
.tools button:hover{background:var(--sun);color:#201712}
.burger{display:none}
@media(max-width:760px){.burger{display:block;margin-inline-start:auto}.menu{display:none;position:absolute;top:100%;inset-inline:0;background:var(--bg);flex-direction:column;padding:10px 20px;border-bottom:2px solid var(--line)}.menu.open{display:flex}}
.hero{position:relative;text-align:center;padding:60px 20px 90px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(252,195,11,.18),transparent 60%)}
.stage{position:relative;width:min(460px,88vw);margin:0 auto 26px;padding:5px;border-radius:34px;background:linear-gradient(120deg,var(--red),var(--sun),var(--green),var(--sun),var(--red));background-size:300% 300%;animation:ring 8s linear infinite;box-shadow:0 0 60px rgba(252,195,11,.28),0 28px 40px rgba(0,0,0,.35)}
@keyframes ring{to{background-position:300% 0}}
.stage video{display:block;width:100%;aspect-ratio:800/792;object-fit:cover;border-radius:29px;background:#faf7fb}
.stage::before,.stage::after{content:"";position:absolute;width:46px;height:46px;border:4px solid var(--sun);pointer-events:none}
.stage::before{top:-12px;inset-inline-start:-12px;border-inline-end:0;border-bottom:0;border-start-start-radius:18px}
.stage::after{bottom:-12px;inset-inline-end:-12px;border-inline-start:0;border-top:0;border-end-end-radius:18px}
.sunwrap svg{width:100%;height:auto;display:block}
.rays{transform-origin:100px 100px;animation:spin 40s linear infinite}
.core{transform-origin:100px 100px;animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.hero h1{font-family:Cinzel,Amiri,serif;font-size:clamp(2.6rem,9vw,5.5rem);margin:0;font-weight:800;line-height:1.2;letter-spacing:0}
.hero h1 span{background:linear-gradient(180deg,#f3df9b,#c9a227 55%,#8c6d12);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:560px;margin:10px auto 26px;color:var(--muted);font-size:1.15rem}
.btn{display:inline-block;padding:12px 28px;border-radius:14px;font-weight:900;text-decoration:none;border:3px solid var(--ink);margin:4px;transition:transform .15s}
.btn.main{background:var(--red);color:#fff;border-color:var(--red)}
.btn.alt{background:var(--green);color:#fff;border-color:var(--green)}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.float{position:absolute;font-size:2rem;opacity:.85;animation:bob 4s ease-in-out infinite}
.float:nth-child(1){top:12%;inset-inline-start:8%}.float:nth-child(2){top:28%;inset-inline-end:9%;animation-delay:-1s}
.float:nth-child(3){bottom:18%;inset-inline-start:14%;animation-delay:-2s}.float:nth-child(4){bottom:12%;inset-inline-end:16%;animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-16px) rotate(8deg)}}
section{max-width:1100px;margin:auto;padding:56px 20px}
h2{font-family:Amiri,Cinzel,serif;font-size:2.2rem;margin:0 0 6px;font-weight:700}
h2::after{content:"";display:block;height:5px;width:90px;margin-top:6px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--sun),var(--green))}
.lead{color:var(--muted);max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:24px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;transition:.25s}
.card:hover{border-color:var(--sun);transform:translateY(-5px)}
.card .ic{font-size:2.2rem;display:inline-block}
.card:hover .ic{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
.card h3{margin:6px 0 2px}
.card p{margin:0;color:var(--muted)}
.band{background:linear-gradient(135deg,#2f5d3a,#1c3a24);color:#fff;border-radius:24px;padding:30px;margin-top:20px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.band .big{font-family:Cinzel,serif;font-size:3rem;color:var(--sun)}
.stats{display:flex;gap:30px;flex-wrap:wrap}
.stats div{text-align:center}
.stats b{display:block;font-size:2rem;color:var(--sun)}
.contact{text-align:center}
.exp{display:flex;align-items:center;gap:22px;margin-top:22px;padding:20px 28px;border:2px solid var(--sun);border-radius:20px;background:var(--card)}
.exp .n{font-family:Cinzel,serif;font-weight:800;font-size:4.2rem;line-height:1;color:var(--sun)}
.exp h3{margin:0;font-family:Amiri,Cinzel,serif;font-size:1.5rem}
.exp p{margin:0;color:var(--muted)}
.socials{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
footer{text-align:center;padding:26px 20px 40px;color:var(--muted);border-top:2px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
var root=document.documentElement,lang='ar';
try{lang=localStorage.getItem('lang')||'ar'}catch(e){}
function apply(){
root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-ar]').forEach(function(el){el.textContent=el.getAttribute('data-'+lang)});
document.getElementById('lang').textContent=lang==='ar'?'EN':'عربي';
document.title=lang==='ar'?'خالو كردي | وان ستيت':'XALO KURDI | One State';
}
document.getElementById('lang').onclick=function(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lang',lang)}catch(e){}apply()};
var m=document.getElementById('menu');
document.getElementById('burger').onclick=function(){m.classList.toggle('open')};
m.addEventListener('click',function(){m.classList.remove('open')});
apply();
})();
</script>
